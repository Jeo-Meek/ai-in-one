<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            height: 100%;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1a1a2e;
        }
        
        .detail-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .detail-header {
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            -webkit-app-region: drag;
            flex-shrink: 0;
        }
        
        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-app-region: no-drag;
        }
        
        .header-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .header-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .webview-container {
            flex: 1;
            width: 100%;
            overflow: hidden;
        }
        
        webview {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="detail-container">
        <div class="detail-header">
            <div class="header-title">
                <span id="ai-name">AI</span>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="reload-btn" title="刷新">↻</button>
                <button class="header-btn" id="external-btn" title="在浏览器中打开">🌐</button>
            </div>
        </div>
        <div class="webview-container">
            <webview id="detail-webview" partition="persist:ai-in-one"></webview>
        </div>
    </div>
    
    <script>
        const { shell } = require('electron');
        
        // 解析 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const aiName = urlParams.get('name') || 'AI';
        const aiUrl = urlParams.get('url') || 'about:blank';
        
        // 设置标题
        document.getElementById('ai-name').textContent = aiName;
        document.title = aiName;
        
        // 设置 webview
        const webview = document.getElementById('detail-webview');
        webview.src = aiUrl;
        webview.useragent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        
        // 刷新按钮
        document.getElementById('reload-btn').addEventListener('click', () => {
            webview.reload();
        });
        
        // 在浏览器中打开
        document.getElementById('external-btn').addEventListener('click', () => {
            const currentUrl = webview.getURL();
            shell.openExternal(currentUrl || aiUrl);
        });
    </script>
</body>
</html>
